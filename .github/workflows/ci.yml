name: ci

# Pushes to main and pull requests. A push to a PR branch already runs through
# pull_request, so a bare push trigger would run every check twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The criteria run weekly and on demand in criteria.yml, not here.
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The supported floor: SBCL's own 2.6.9 binary, checked against its
          # SHA-256 (the .tar inside matches the release's signed checksum list).
          # Splice needs 2.6.6 or later, where FDEFINITION returns a trace's
          # wrapper and SB-EXT:UNENCAPSULATED-FUNCTION unwraps it. apt's SBCL
          # (2.2.9 on 24.04) is older, so it is not used.
          - name: sbcl-2.6.9-ubuntu-24.04
            container: ""
            install: |
              cd /tmp
              curl -fsSLO https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.9/sbcl-2.6.9-x86-64-linux-binary.tar.bz2
              echo "39fac28407405841003e4c2abfbe0d96abd93b7701e8b61cdd35e713943b46d6  sbcl-2.6.9-x86-64-linux-binary.tar.bz2" | sha256sum -c
              tar -xjf sbcl-2.6.9-x86-64-linux-binary.tar.bz2
              cd sbcl-2.6.9-x86-64-linux
              sudo sh install.sh
          # Arch tracks current SBCL, matching local development. The version
          # floats with Arch; the SBCL version step records which one ran.
          # The container runs as root, so no sudo.
          - name: sbcl-current-arch
            container: archlinux:latest
            install: pacman -Syu --noconfirm sbcl
    name: checks (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install SBCL
        run: ${{ matrix.install }}

      - name: SBCL version
        run: sbcl --version

      # FiveAM and its dependencies, for the unit tests. These are the
      # Quicklisp release tarballs local development loads, checked against
      # their SHA-256 so a changed archive fails here rather than in a test.
      # ASDF finds anything under ~/common-lisp/ with no configuration.
      - name: Fetch FiveAM
        run: |
          mkdir -p ~/common-lisp
          cd ~/common-lisp
          base=https://beta.quicklisp.org/archive
          curl -fsSLO $base/alexandria/2024-10-12/alexandria-20241012-git.tgz
          curl -fsSLO $base/asdf-flv/2023-10-21/asdf-flv-version-2.2.tgz
          curl -fsSLO $base/fiveam/2024-10-12/fiveam-20241012-git.tgz
          curl -fsSLO $base/trivial-backtrace/2023-02-14/trivial-backtrace-20230214-git.tgz
          sha256sum -c <<'EOF'
          dcdfc5bac229a952358dfe661f0860e8a02480e406d0d95dee4300cdc3d45b31  alexandria-20241012-git.tgz
          63f3aeaf7a93e9c590e674430dbd80dca387c8a18280bef74d58fcb83551a203  asdf-flv-version-2.2.tgz
          860dd99e52fe83bd4a286f9b85b53981969bf641c1da96b64a895bea4137ab61  fiveam-20241012-git.tgz
          e34a3355ca15c2e0ed84160046c2b16680a7e8b164d67d5a049656786af6c84f  trivial-backtrace-20230214-git.tgz
          EOF
          for archive in *.tgz; do tar -xzf "$archive"; done

      # Every suite and the demo, each in a fresh SBCL. The pre-push hook runs
      # the same file, so the list lives there.
      - name: Checks
        run: sbcl --non-interactive --load test/check.lisp
